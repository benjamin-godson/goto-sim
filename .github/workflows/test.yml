name: Tests
# Run the test suite on pull requests and pushes to main branch
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * Sun'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install hatch
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch
    - name: Run test suite
      run: hatch run +py=${{ matrix.python-version }} test:run
    - name: Ruff Linting
      uses: astral-sh/ruff-action@v3

